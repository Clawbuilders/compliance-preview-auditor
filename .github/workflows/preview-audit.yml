# Example: audit every successful preview deployment and post the report on its pull request.
#
# Copy this file into the repository whose previews you want audited. It does nothing until you set:
#   - repository variable AUDITOR_URL  (Settings > Secrets and variables > Actions > Variables), e.g. https://<your-worker>.workers.dev
#   - repository secret   AUDITOR_TOKEN (the auditor's RUN_TOKEN)
# In this repository AUDITOR_URL is not set, so the job is skipped.
#
# It runs on deployment_status events, which preview hosts such as Cloudflare Pages (GitHub integration) create for each
# pull-request build. One comment per pull request is kept up to date, found by the marker line below.
name: Preview audit (example)

on:
  deployment_status:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-audit-${{ github.event.deployment.sha }}
  cancel-in-progress: true

jobs:
  audit:
    if: vars.AUDITOR_URL != '' && github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AUDITOR_URL: ${{ vars.AUDITOR_URL }}
      AUDITOR_TOKEN: ${{ secrets.AUDITOR_TOKEN }}
      # Passed through env, never interpolated into the script, so a hostile URL cannot inject shell.
      PREVIEW_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
      SHA: ${{ github.event.deployment.sha }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      MARKER: "<!-- compliance-preview-auditor -->"
    steps:
      - name: Audit the preview URL
        run: |
          set -euo pipefail
          if [ -z "$PREVIEW_URL" ]; then echo "The deployment has no URL; nothing to audit."; exit 0; fi
          body=$(jq -n --arg url "$PREVIEW_URL" '{url: $url}')
          status=$(curl -sS -o report.md -w '%{http_code}' --max-time 120 \
            -X POST "${AUDITOR_URL%/}/audit?format=markdown" \
            -H "Authorization: Bearer $AUDITOR_TOKEN" -H "content-type: application/json" \
            --data "$body") || status="000"
          if [ "$status" != "200" ]; then
            {
              echo "## Preview audit"
              echo
              echo "The auditor could not audit $PREVIEW_URL (HTTP $status):"
              echo
              echo '```'
              head -c 2000 report.md 2>/dev/null || true
              echo
              echo '```'
            } > error.md
            mv error.md report.md
          fi
          { echo "$MARKER"; cat report.md; } > comment.md

      - name: Post or update the pull request comment
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[] | select(.state == "open")][0].number // empty')
          if [ -z "$pr" ]; then echo "No open pull request for $SHA; skipping the comment."; cat comment.md; exit 0; fi
          id=$(gh api --paginate "repos/$REPO/issues/$pr/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$MARKER\"))) | .id" | tail -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@comment.md > /dev/null
            echo "Updated comment $id on #$pr."
          else
            gh pr comment "$pr" --repo "$REPO" --body-file comment.md
          fi
